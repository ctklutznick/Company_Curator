<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Company Curator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1a1714; --ink-2: #3a342e; --ink-3: #6b625a; --ink-4: #9a9089;
            --paper: #fbf8f3; --paper-2: #f2ede3; --line: #1a1714;
            --accent-red: #c5463a; --accent-green: #4a7c3a; --accent-yellow: #f2d35a;
            --hl: rgba(242, 211, 90, 0.45); --hl-red: rgba(197, 70, 58, 0.22);
            --hl-blue: rgba(58, 90, 140, 0.22);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Fraunces', Georgia, serif;
            background: var(--paper-2);
            color: var(--ink);
            min-height: 100vh;
            display: grid;
            place-items: center;
        }
        .auth-card {
            background: var(--paper);
            border: 1.5px solid var(--line);
            border-radius: 6px 4px 7px 3px;
            padding: 36px 32px;
            width: 380px;
            max-width: 90vw;
        }
        .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
        .logo-icon {
            width: 30px; height: 30px;
            border: 1.8px solid var(--ink); border-radius: 50%;
            display: grid; place-items: center;
            background: var(--accent-yellow); font-size: 16px;
        }
        .logo-text { font-size: 22px; font-weight: 700; }
        h2 { font-size: 20px; margin-bottom: 4px; }
        .subtitle { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-3); letter-spacing: 1px; margin-bottom: 20px; }
        .flash {
            padding: 8px 12px; margin-bottom: 12px; border-radius: 4px; font-size: 13px;
        }
        .flash.error { background: var(--hl-red); border: 1px solid var(--accent-red); color: var(--accent-red); }
        .flash.success { background: rgba(74,124,58,0.28); border: 1px solid var(--accent-green); color: var(--accent-green); }
        label {
            display: block; font-family: 'JetBrains Mono', monospace;
            font-size: 11px; color: var(--ink-3); letter-spacing: 0.5px;
            text-transform: uppercase; margin-bottom: 4px; margin-top: 14px;
        }
        input[type="email"], input[type="password"], input[type="text"] {
            width: 100%; padding: 9px 12px;
            border: 1.5px solid var(--line);
            border-radius: 3px 6px 2px 5px;
            background: var(--paper);
            font-family: 'Fraunces', Georgia, serif;
            font-size: 14px; color: var(--ink);
        }
        input:focus { outline: none; box-shadow: 0 0 0 3px var(--hl); }
        .btn {
            display: block; width: 100%; margin-top: 20px; padding: 10px;
            border: 1.5px solid var(--line); border-radius: 4px 7px 3px 6px;
            background: var(--ink); color: var(--paper);
            font-family: 'Fraunces', Georgia, serif;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .btn:hover { background: var(--ink-2); }
        .link-row {
            text-align: center; margin-top: 16px;
            font-size: 13px; color: var(--ink-3);
        }
        .link-row a { color: var(--ink); font-weight: 600; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="logo">
            <div class="logo-icon">&#10022;</div>
            <div class="logo-text">Curator</div>
        </div>
        <h2>Create Account</h2>
        <div class="subtitle">INVESTMENT RESEARCH</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="display_name">Display Name</label>
            <input type="text" id="display_name" name="display_name" required autofocus maxlength="100">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8">

            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required>

            <button type="submit" class="btn">Sign Up</button>
        </form>

        <div class="link-row">
            Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
        </div>
    </div>
</body>
</html>
